  --action-hover: #1c1c1c;
  --on-action: #ffffff;
  --focus-ring: #353635;
  --summit: #353635;
  --summit-deep: #1c1c1c;
  --on-summit: #ffffff;
  --sun: #fcd65e;
  --sun-deep: #eab930;
  --apricot: #faad6d;

  --glacier: #a9cdda;
  --glacier-deep: #50b3cd;
  --meadow: #8dcd9a;
  --meadow-deep: #58bb62;
  --on-brand: #353635;
  --sun-tint: #fef6dc;
  --apricot-tint: #fdeee2;
  --glacier-tint: #e8f3f7;
  --meadow-tint: #e9f5eb;
  --sun-text: #8a6a0b;
  --apricot-text: #a34f10;
  --glacier-text: #1f6f86;
  --meadow-text: #2d7a38;
  --shadow-float: 0 8px 24px rgba(28,28,28,0.12);
  --shadow-lift: 0 2px 6px rgba(28,28,28,0.08);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --radius-pill: 9999px;
  --stroke-hairline: 1px;
  --stroke-focus: 2px;
  --font-sans: "Figtree", "Helvetica Neue", Helvetica, Arial, sans-serif;

  --surface-sunken: #1c1c1c;
  --ink: #f2f1ec;
  --ink-strong: #ffffff;
  --ink-muted: #a3a39f;

  --action: #f2f1ec;
  --action-hover: #ffffff;

  --focus-ring: #f2f1ec;

  --glacier: #a9cdda;
  --glacier-deep: #50b3cd;
  --meadow: #8dcd9a;
  --meadow-deep: #58bb62;
  --on-brand: #1c1c1c;
  --sun-tint: #332c14;
  --apricot-tint: #35261a;

  --meadow-tint: #1d2e20;
  --sun-text: #fcd65e;

/* Alpine Nutrition component styles (bundle.css) */

/* Alpine Nutrition — component styles. Every value is a token from tokens.css. */
body { margin: 0; background: var(--surface-page); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 22px; }
.an-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding: var(--space-4); }
.an-stack { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4); }
.an-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-4); padding: var(--space-4); }
:where(.an-btn, .an-tab, .an-search input, .an-card-click):focus-visible { outline: var(--stroke-focus) solid var(--focus-ring); outline-offset: 2px; }

/* Button — pill, sentence case, medium weight, never bold/caps */
.an-btn { font: 500 14px/20px var(--font-sans); display: inline-flex; align-items: center; gap: var(--space-2); border-radius: var(--radius-pill); border: var(--stroke-hairline) solid transparent; padding: 10px 20px; cursor: pointer; transition: background-color .12s, border-color .12s; white-space: nowrap; }
.an-btn-sm { padding: 6px 14px; font-size: 13px; line-height: 18px; }
.an-btn-primary { background: var(--action); color: var(--on-action); }
.an-btn-primary:hover { background: var(--action-hover); }
.an-btn-secondary { background: transparent; color: var(--ink); border-color: var(--ink); }
.an-btn-secondary:hover { background: var(--surface-sunken); }
.an-btn-accent { background: var(--sun); color: var(--on-brand); }
.an-btn-accent:hover { background: var(--sun-deep); }
.an-btn-ghost { background: transparent; color: var(--ink); }
.an-btn-ghost:hover { background: var(--surface-sunken); }
.an-btn:disabled { opacity: .45; cursor: not-allowed; }

/* SearchField — pill input */
.an-search { position: relative; display: flex; align-items: center; min-width: 240px; flex: 1; }
.an-search svg { position: absolute; left: 16px; width: 18px; height: 18px; stroke: var(--ink-muted); fill: none; stroke-width: 1.75; stroke-linecap: round; pointer-events: none; }
.an-search input { width: 100%; font: 400 15px/22px var(--font-sans); color: var(--ink); background: var(--surface-card); border: var(--stroke-hairline) solid var(--border-control); border-radius: var(--radius-pill); padding: 10px 20px 10px 44px; box-sizing: border-box; }
.an-search input::placeholder { color: var(--ink-muted); }

/* PillTabs */
.an-tabs { display: inline-flex; flex-wrap: wrap; gap: var(--space-2); }
.an-tab { font: 500 14px/20px var(--font-sans); border-radius: var(--radius-pill); padding: 8px 16px; cursor: pointer; background: var(--surface-card); color: var(--ink); border: var(--stroke-hairline) solid var(--hairline); }
.an-tab:hover { border-color: var(--border-control); }
.an-tab[aria-selected="true"] { background: var(--action); color: var(--on-action); border-color: var(--action); }

/* Card — frame */
.an-card { background: var(--surface-card); border: var(--stroke-hairline) solid var(--hairline); border-radius: var(--radius-md); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.an-card-lg { border-radius: var(--radius-lg); }
.an-card-flat { border-color: transparent; }
.an-card-click { cursor: pointer; transition: box-shadow .12s; }
.an-card-click:hover { box-shadow: var(--shadow-lift); }
.an-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); }
.an-card-title { font: 700 20px/26px var(--font-sans); margin: 0; color: var(--ink); }
.an-card-sub { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); margin: 2px 0 0; }

/* StatTile — KPI on a brand ground or card */
.an-stat { border-radius: var(--radius-md); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-1); background: var(--surface-card); color: var(--ink); border: var(--stroke-hairline) solid var(--hairline); min-width: 0; }
.an-stat-sun { background: var(--sun); color: var(--on-brand); border-color: transparent; }
.an-stat-apricot { background: var(--apricot); color: var(--on-brand); border-color: transparent; }
.an-stat-glacier { background: var(--glacier); color: var(--on-brand); border-color: transparent; }
.an-stat-meadow { background: var(--meadow); color: var(--on-brand); border-color: transparent; }
.an-stat-summit { background: var(--summit); color: var(--on-summit); border-color: transparent; }
.an-stat-label { font: 600 12px/16px var(--font-sans); letter-spacing: .02em; }
.an-stat-value { font: 700 40px/44px var(--font-sans); letter-spacing: -.02em; }
.an-stat-foot { display: flex; align-items: center; gap: var(--space-2); font: 400 13px/18px var(--font-sans); }
.an-delta { font-weight: 600; }
.an-stat-card .an-delta-up { color: var(--meadow-text); }
.an-stat-card .an-delta-down { color: var(--apricot-text); }

/* StatusBadge — pill with dot + word (never color alone) */
.an-badge { display: inline-flex; align-items: center; gap: 6px; border-radius: var(--radius-pill); padding: 3px 10px 3px 8px; font: 500 13px/18px var(--font-sans); color: var(--ink); background: var(--surface-sunken); white-space: nowrap; }
.an-badge i { width: 8px; height: 8px; border-radius: var(--radius-pill); background: var(--ink-muted); display: inline-block; }
.an-badge-success { background: var(--meadow-tint); } .an-badge-success i { background: var(--meadow-deep); }
.an-badge-warning { background: var(--sun-tint); } .an-badge-warning i { background: var(--sun-deep); }
.an-badge-risk { background: var(--apricot-tint); } .an-badge-risk i { background: var(--apricot-deep); }
.an-badge-info { background: var(--glacier-tint); } .an-badge-info i { background: var(--glacier-deep); }

/* SourceChip — which system a record came from */
.an-source { display: inline-flex; align-items: center; gap: 6px; border-radius: var(--radius-pill); padding: 2px 10px 2px 3px; font: 500 12px/18px var(--font-sans); color: var(--ink); border: var(--stroke-hairline) solid var(--hairline); background: var(--surface-card); white-space: nowrap; }
.an-source b { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: var(--radius-pill); font: 700 10px/1 var(--font-sans); color: var(--on-brand); background: var(--glacier); }
.an-source-erp b { background: var(--apricot); } .an-source-pos b { background: var(--meadow); } .an-source-agent b { background: var(--sun); } .an-source-crm b { background: var(--glacier); }

/* InsightCard — agent recommendation */
.an-insight { background: var(--sun-tint); border-radius: var(--radius-md); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); color: var(--ink); }
.an-insight-head { display: flex; align-items: center; gap: var(--space-2); font: 600 12px/16px var(--font-sans); letter-spacing: .02em; }
.an-insight-head b { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: var(--radius-pill); background: var(--sun); color: var(--on-brand); }
.an-insight-head svg { width: 14px; height: 14px; fill: currentColor; }
.an-insight h4 { margin: 0; font: 700 16px/22px var(--font-sans); }
.an-insight p { margin: 0; font: 400 15px/22px var(--font-sans); }
.an-insight-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); padding-top: var(--space-1); }

/* ProgressMeter — plan vs target */
.an-meter { display: flex; flex-direction: column; gap: 6px; }
.an-meter-top { display: flex; justify-content: space-between; gap: var(--space-2); font: 400 13px/18px var(--font-sans); }
.an-meter-top strong { font-weight: 600; }
.an-meter-track { height: 10px; border-radius: var(--radius-pill); background: var(--surface-sunken); overflow: hidden; }
.an-meter-fill { height: 100%; border-radius: var(--radius-pill); background: var(--glacier-deep); }
.an-meter-meadow .an-meter-fill { background: var(--meadow-deep); } .an-meter-sun .an-meter-fill { background: var(--sun-deep); } .an-meter-apricot .an-meter-fill { background: var(--apricot-deep); }

/* DataTable */
.an-table-wrap { background: var(--surface-card); border: var(--stroke-hairline) solid var(--hairline); border-radius: var(--radius-sm); overflow: auto; }
.an-table { width: 100%; border-collapse: collapse; font: 400 13px/18px var(--font-sans); color: var(--ink); }
.an-table th { text-align: left; font-weight: 600; color: var(--ink-muted); background: var(--surface-sunken); padding: var(--space-2) var(--space-4); white-space: nowrap; }
.an-table td { padding: var(--space-3) var(--space-4); border-top: var(--stroke-hairline) solid var(--hairline); vertical-align: middle; }
.an-table .an-num { text-align: right; font-variant-numeric: tabular-nums; }
.an-table tr.an-selected td { background: var(--glacier-tint); }

/* Layout: header strip, then a 12-column dashboard — hero decision (8) beside gaps (4), portfolio full width, timeline full width, people (8) beside promotions and baseline (4). */
html { -webkit-text-size-adjust: 100%; }
body { background: var(--surface-page); color: var(--ink); font-family: var(--font-sans); }
a { color: var(--glacier-text); }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: var(--stroke-focus) solid var(--focus-ring); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1480px; margin: 0 auto; padding-inline: var(--space-7); padding-block: var(--space-5) var(--space-7); display: flex; flex-direction: column; gap: var(--space-6); box-sizing: border-box; }
@media (max-width: 760px) { .wrap { padding-inline: var(--space-4); gap: var(--space-5); } }
.boot { padding: var(--space-7); font: 400 15px/22px var(--font-sans); color: var(--ink-muted); }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--space-4); }
.top-left { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
.brandrow { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.brandrow img { height: 26px; width: auto; }
.logo-dark { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-light { display: none; } :root:not([data-theme="light"]) .logo-dark { display: inline; } }
:root[data-theme="dark"] .logo-light { display: none; }
:root[data-theme="dark"] .logo-dark { display: inline; }
.brandrow .sep { width: 1px; height: 22px; background: var(--hairline); }
.ws-label { font: 500 14px/20px var(--font-sans); color: var(--ink-muted); }
h1.acct { margin: 0; font: 700 28px/34px var(--font-sans); letter-spacing: -0.01em; color: var(--ink-strong); text-wrap: balance; }
.acct-meta { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); font: 400 13px/18px var(--font-sans); color: var(--ink-muted); align-items: center; }
.acct-meta strong { color: var(--ink); font-weight: 600; }
.top-right { display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-2); min-width: 0; }
.refresh-row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; justify-content: flex-end; }
.stamp { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); text-align: right; max-width: 460px; }
.stamp strong { color: var(--ink); font-weight: 600; }
@media (max-width: 760px) { .top-right { align-items: flex-start; } .stamp { text-align: left; } .refresh-row { justify-content: flex-start; } }

/* Banners */
.banner { border-radius: var(--radius-md); padding: var(--space-4) var(--space-5); display: flex; gap: var(--space-3); align-items: flex-start; font: 400 14px/20px var(--font-sans); }
.banner p { margin: 0; }
.banner strong { font-weight: 600; }
.banner-info { background: var(--glacier-tint); }
.banner-risk { background: var(--apricot-tint); }
.banner-ok { background: var(--meadow-tint); }
.banner-warn { background: var(--sun-tint); }
.banner .dot { flex: none; width: 10px; height: 10px; border-radius: var(--radius-pill); margin-top: 5px; background: var(--glacier-deep); }
.banner-risk .dot { background: var(--apricot-deep); } .banner-ok .dot { background: var(--meadow-deep); } .banner-warn .dot { background: var(--sun-deep); }

/* Grid */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--space-5); align-items: start; }
.s8 { grid-column: span 8; } .s4 { grid-column: span 4; } .s12 { grid-column: span 12; }
.col { display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }
@media (max-width: 1180px) { .s8, .s4 { grid-column: span 12; } }
.eyebrow { font: 600 12px/16px var(--font-sans); letter-spacing: 0.02em; color: var(--ink-muted); margin: 0; }
.sec-intro { font: 300 20px/26px var(--font-slab); color: var(--ink); margin: 0; max-width: 62ch; }

/* Hero */
.hero { background: var(--summit); color: var(--on-summit); border-radius: var(--radius-xl); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }
@media (max-width: 760px) { .hero { padding: var(--space-5); border-radius: var(--radius-lg); } }
.hero-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--space-3); align-items: flex-start; }
.hero .eyebrow { color: var(--on-summit); opacity: .82; }
.hero h2 { margin: 4px 0 0; font: 700 36px/40px var(--font-sans); letter-spacing: -0.02em; text-wrap: balance; }
.hero .sub { font: 400 14px/20px var(--font-sans); opacity: .86; margin-top: 6px; }
.hero-badges { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.figs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-4); }
@media (max-width: 900px) { .figs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.fig { border: var(--stroke-hairline) solid color-mix(in srgb, var(--on-summit) 22%, transparent); border-radius: var(--radius-md); padding: var(--space-4); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fig .lab { font: 600 12px/16px var(--font-sans); letter-spacing: .02em; opacity: .85; }
.fig .val { font: 700 40px/44px var(--font-sans); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.fig .val small { font: 500 15px/20px var(--font-sans); letter-spacing: 0; opacity: .85; margin-left: 4px; }
.fig .val.muted { font-size: 22px; line-height: 44px; opacity: .8; }
.fig .foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: 400 12px/16px var(--font-sans); }
.qual { display: inline-flex; align-items: center; border-radius: var(--radius-pill); padding: 1px 8px; font: 500 12px/18px var(--font-sans); border: var(--stroke-hairline) solid currentColor; white-space: nowrap; }
.hero-cols { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: var(--space-5); }
@media (max-width: 900px) { .hero-cols { grid-template-columns: minmax(0, 1fr); } }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px var(--space-4); margin: 0; font: 400 14px/20px var(--font-sans); }
.kv dt { opacity: .78; }
.kv dd { margin: 0; min-width: 0; }
.next { background: var(--surface-card); color: var(--ink); border-radius: var(--radius-lg); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
.next h3 { margin: 0; font: 700 16px/22px var(--font-sans); }
.next p { margin: 0; font: 400 14px/20px var(--font-sans); }
.next .meta { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
a.rec { text-decoration: none; border-radius: var(--radius-pill); display: inline-flex; }
a.rec:hover .an-source { border-color: var(--border-control); }
.hero-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: flex-end; }
.hero .an-btn-secondary { color: var(--on-summit); border-color: var(--on-summit); }
.hero .an-btn-secondary:hover { background: color-mix(in srgb, var(--on-summit) 12%, transparent); }
.hero .an-btn-primary { background: var(--surface-card); color: var(--ink); }
.hero .an-btn-primary:hover { background: var(--surface-sunken); }
.flag { color: var(--on-brand); background: var(--apricot); border-radius: var(--radius-pill); padding: 1px 10px; font: 500 12px/18px var(--font-sans); white-space: nowrap; }

/* Gaps list */
.gaps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-3); }
.gap { border-radius: var(--radius-sm); padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: 6px; background: var(--surface-sunken); }
.gap.risk { background: var(--apricot-tint); }
.gap-head { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
.gap-title { font: 600 14px/20px var(--font-sans); }
.gap p { margin: 0; font: 400 13px/18px var(--font-sans); color: var(--ink); }
.gap q { font-style: italic; }

/* Portfolio */
.toolbar { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; justify-content: space-between; }
.toolbar .an-search { max-width: 320px; }
.tabcount { opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }
.pf { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--space-5); align-items: start; }
@media (max-width: 1000px) { .pf { grid-template-columns: minmax(0, 1fr); } }
.pf-list { display: flex; flex-direction: column; gap: var(--space-3); list-style: none; margin: 0; padding: 0; }
.pf-item { width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--surface-card); border: var(--stroke-hairline) solid var(--hairline); border-radius: var(--radius-md); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); cursor: pointer; transition: box-shadow .12s, border-color .12s, background-color .12s; }
.pf-item:hover { box-shadow: var(--shadow-lift); }
.pf-item[aria-pressed="true"] { background: var(--glacier-tint); border-color: var(--glacier-deep); }
.pf-row { display: flex; justify-content: space-between; gap: var(--space-2); align-items: flex-start; }
.pf-name { font: 600 16px/22px var(--font-sans); }
.pf-id { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.pf-nums { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); font: 400 13px/18px var(--font-sans); font-variant-numeric: tabular-nums; }
.pf-nums b { font-weight: 600; }
.hero-tag { font: 500 12px/18px var(--font-sans); background: var(--summit); color: var(--on-summit); border-radius: var(--radius-pill); padding: 1px 8px; white-space: nowrap; }
.detail { background: var(--surface-card); border: var(--stroke-hairline) solid var(--hairline); border-radius: var(--radius-lg); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.detail h3 { margin: 0; font: 700 20px/26px var(--font-sans); }
.detail h4 { margin: 0; font: 600 16px/22px var(--font-sans); }
.fields { width: 100%; border-collapse: collapse; font: 400 13px/18px var(--font-sans); }
.fields th { text-align: left; font-weight: 400; color: var(--ink-muted); padding: 6px var(--space-3) 6px 0; vertical-align: top; width: 42%; }
.fields th code { display: block; font: 400 11px/16px ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink-muted); opacity: .85; }
.fields td { padding: 6px 0; border-top: var(--stroke-hairline) solid var(--hairline); vertical-align: top; overflow-wrap: anywhere; }
.fields th { border-top: var(--stroke-hairline) solid var(--hairline); }
.fields .blank { color: var(--apricot-text); }
.tablewrap { overflow-x: auto; }
.twocol { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-5); }
@media (max-width: 760px) { .twocol { grid-template-columns: minmax(0, 1fr); } }
.note { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); font: 400 13px/18px var(--font-sans); color: var(--ink-muted); align-items: center; }

/* Timeline */
.tl { display: flex; flex-direction: column; gap: 0; min-width: 760px; }
.tl-scroll { overflow-x: auto; }
.tl-row { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: var(--space-4); padding: var(--space-3) 0; border-top: var(--stroke-hairline) solid var(--hairline); }
.tl-row.axis { border-top: 0; padding: 0 0 var(--space-1); }
.tl-lane { display: flex; flex-direction: column; gap: 4px; }
.tl-lane b { font: 600 14px/20px var(--font-sans); }
.tl-lane span { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.tl-track { position: relative; height: 30px; }
.tl-track::before { content: ""; position: absolute; left: 0; right: 0; top: 14px; height: 2px; background: var(--hairline); border-radius: 2px; }
.tl-today { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--ink-muted); }
.tl-dot { position: absolute; top: 7px; width: 16px; height: 16px; margin-left: -8px; border-radius: var(--radius-pill); box-sizing: border-box; background: var(--glacier-deep); border: 2px solid var(--surface-card); padding: 0; cursor: pointer; }
.tl-dot.done { background: var(--meadow-deep); }
.tl-dot.flag { background: var(--apricot-deep); }
.tl-dot.milestone { background: var(--summit); }
:root[data-theme="dark"] .tl-dot.milestone { background: var(--on-summit); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tl-dot.milestone { background: var(--on-summit); } }
.tl-dot[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--focus-ring); }
.tl-ticks { position: relative; height: 18px; font: 500 12px/18px var(--font-sans); color: var(--ink-muted); }
.tl-ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.tl-ticks span.today { color: var(--ink); font-weight: 600; }
.tl-items { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px var(--space-4); font: 400 13px/18px var(--font-sans); }
.tl-items li { display: inline-flex; gap: 6px; align-items: baseline; }
.tl-items .d { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tl-missing { font: 500 12px/18px var(--font-sans); color: var(--apricot-text); }
.tl-sel { background: var(--glacier-tint); border-radius: var(--radius-sm); padding: var(--space-3) var(--space-4); font: 400 14px/20px var(--font-sans); display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); align-items: center; }

/* People */
.lanes3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }
@media (max-width: 900px) { .lanes3 { grid-template-columns: minmax(0, 1fr); } }
.conv { border: var(--stroke-hairline) solid var(--hairline); border-radius: var(--radius-md); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
.conv h4 { margin: 0; font: 600 16px/22px var(--font-sans); }
.person { display: flex; gap: var(--space-3); align-items: flex-start; }
.avatar { flex: none; width: 36px; height: 36px; border-radius: var(--radius-pill); display: grid; place-items: center; font: 600 13px/1 var(--font-sans); background: var(--glacier); color: var(--on-brand); }
.avatar.ops { background: var(--meadow); } .avatar.sc { background: var(--apricot); } .avatar.muted { background: var(--surface-sunken); color: var(--ink); }
.person .nm { font: 600 14px/20px var(--font-sans); }
.person .tt { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.small { font: 400 13px/18px var(--font-sans); }
.muted { color: var(--ink-muted); }
.others { display: flex; flex-direction: column; gap: 6px; border-top: var(--stroke-hairline) solid var(--hairline); padding-top: var(--space-3); }
.acts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.act { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: var(--space-3); padding: var(--space-3) 0; border-top: var(--stroke-hairline) solid var(--hairline); align-items: start; }
@media (max-width: 640px) { .act { grid-template-columns: 76px minmax(0, 1fr); } .act > :last-child { grid-column: 2; } }
.act .dt { font: 600 13px/18px var(--font-sans); font-variant-numeric: tabular-nums; }
.act .dt span { display: block; font-weight: 400; color: var(--ink-muted); }
.act .sj { font: 600 14px/20px var(--font-sans); }
.act .ds { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); margin-top: 2px; }
.filters { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; justify-content: space-between; }

/* Section states */
.sec { position: relative; }
.sec[aria-busy="true"] > .busy { display: flex; }
.busy { display: none; position: absolute; inset: 0; border-radius: inherit; background: color-mix(in srgb, var(--surface-card) 72%, transparent); align-items: flex-start; justify-content: center; padding-top: var(--space-6); z-index: 2; font: 500 14px/20px var(--font-sans); color: var(--ink); }
.busy span { background: var(--surface-card); border: var(--stroke-hairline) solid var(--hairline); border-radius: var(--radius-pill); padding: 6px 14px; box-shadow: var(--shadow-float); }
.empty { border: var(--stroke-hairline) dashed var(--border-control); border-radius: var(--radius-md); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-2); }
.empty h4 { margin: 0; font: 600 16px/22px var(--font-sans); }
.empty p { margin: 0; font: 400 14px/20px var(--font-sans); color: var(--ink-muted); }
.baseline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.baseline li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3); padding: var(--space-2) 0; border-top: var(--stroke-hairline) solid var(--hairline); font: 400 13px/18px var(--font-sans); align-items: start; }
.baseline li:first-child { border-top: 0; }
.baseline .why { color: var(--ink-muted); display: block; }

/* Dialog */
.scrim { position: fixed; inset: 0; background: color-mix(in srgb, var(--summit-deep) 55%, transparent); display: grid; place-items: center; padding: var(--space-4); z-index: 20; }
.dialog { background: var(--surface-card); color: var(--ink); border-radius: var(--radius-lg); box-shadow: var(--shadow-float); width: min(760px, 100%); max-height: calc(100vh - 48px); overflow: auto; padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); box-sizing: border-box; }
.dialog h2 { margin: 0; font: 700 20px/26px var(--font-sans); }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3) var(--space-4); }
@media (max-width: 640px) { .form { grid-template-columns: minmax(0, 1fr); } }
.form label { display: flex; flex-direction: column; gap: 4px; font: 500 13px/18px var(--font-sans); }
.form label.full { grid-column: 1 / -1; }
.form input, .form select, .form textarea { font: 400 15px/22px var(--font-sans); color: var(--ink); background: var(--surface-card); border: var(--stroke-hairline) solid var(--border-control); border-radius: var(--radius-sm); padding: 8px 12px; min-width: 0; }
.form input, .form select { border-radius: var(--radius-pill); padding: 8px 16px; }
.form .hint { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.diff td.was { color: var(--ink-muted); text-decoration: line-through; }
.diff td.now { font-weight: 600; }
.dlg-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: flex-end; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* v3 layout: the day (needs you 7 / agenda 5), pulse strip, full-width account timeline, then a tabbed workspace. */
.day { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: var(--space-5); align-items: start; }
@media (max-width: 1100px) { .day { grid-template-columns: minmax(0, 1fr); } }

/* Needs you */
.queue { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.qi { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: var(--space-3); padding: var(--space-4) 0; border-top: var(--stroke-hairline) solid var(--hairline); align-items: start; }
.qi:first-child { border-top: 0; padding-top: 0; }
@media (max-width: 640px) { .qi { grid-template-columns: 28px minmax(0, 1fr); } .qi-act { grid-column: 2; } }
.qi-rank { width: 28px; height: 28px; border-radius: var(--radius-pill); display: grid; place-items: center; font: 600 13px/1 var(--font-sans); background: var(--surface-sunken); color: var(--ink); font-variant-numeric: tabular-nums; }
.qi.sev3 .qi-rank { background: var(--apricot); color: var(--on-brand); }
.qi-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.qi-top { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.qi-area { font-weight: 600; color: var(--ink); }
.qi-title { margin: 0; font: 600 16px/22px var(--font-sans); color: var(--ink-strong); text-wrap: balance; }
.qi-why { margin: 0; font: 400 14px/20px var(--font-sans); color: var(--ink); max-width: 78ch; }

/* Agenda */
.agenda { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ag-day { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: var(--space-3); padding: var(--space-3) 0; border-top: var(--stroke-hairline) solid var(--hairline); }
.ag-day:first-child { border-top: 0; padding-top: 0; }
.ag-date { display: flex; flex-direction: column; align-items: center; background: var(--surface-sunken); border-radius: var(--radius-sm); padding: 6px 0; font: 500 11px/14px var(--font-sans); color: var(--ink-muted); height: fit-content; }
.ag-date b { font: 700 22px/26px var(--font-sans); color: var(--ink-strong); font-variant-numeric: tabular-nums; }
.ag-items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.ag-item { display: flex; flex-direction: column; gap: 2px; border-left: 3px solid var(--hairline); padding-left: var(--space-3); }
.ag-item.k-meeting { border-left-color: var(--summit); }
.ag-item.k-promotion { border-left-color: var(--glacier-deep); }
.ag-item.k-deadline { border-left-color: var(--apricot-deep); }
.ag-item.k-task { border-left-color: var(--meadow-deep); }
.ag-kind { font: 600 12px/16px var(--font-sans); color: var(--ink-muted); }
.ag-flag { color: var(--apricot-text); }
.ag-label { font: 600 14px/20px var(--font-sans); }
.ag-sub { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }

/* Pulse */
.pulse { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--space-4); }
@media (max-width: 1280px) { .pulse { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 640px) { .pulse { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { font: inherit; text-align: left; cursor: pointer; background: var(--surface-card); color: var(--ink); border: var(--stroke-hairline) solid var(--hairline); border-radius: var(--radius-md); padding: var(--space-4); display: flex; flex-direction: column; gap: 4px; min-width: 0; transition: box-shadow .12s; }
.tile:hover { box-shadow: var(--shadow-lift); }
.tile.t-apricot { background: var(--apricot); color: var(--on-brand); border-color: transparent; }
.tile.t-empty { background: var(--surface-sunken); border-style: dashed; border-color: var(--border-control); }
.t-lab { font: 600 12px/16px var(--font-sans); letter-spacing: .02em; }
.t-val { font: 700 32px/38px var(--font-sans); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: inherit; }
.tile.t-empty .t-val { font-size: 24px; color: var(--ink-muted); }
.t-cap { font: 400 13px/18px var(--font-sans); }
.tile:not(.t-apricot) .t-cap { color: var(--ink-muted); }

/* Account timeline */
.tlx { gap: var(--space-4); }
.tlx .an-card-head { flex-wrap: wrap; }
.tl2 { display: flex; flex-direction: column; min-width: 860px; }
.tl2-row { display: grid; grid-template-columns: var(--tl-label) minmax(0, 1fr); gap: var(--space-4); padding: var(--space-3) 0; border-top: var(--stroke-hairline) solid var(--hairline); align-items: start; }
.tl2-row.axis { border-top: 0; padding: 0 0 var(--space-1); }
.tl2-track { position: relative; background: linear-gradient(var(--hairline), var(--hairline)) left 17px / 100% 2px no-repeat; }
.tl2-none { position: absolute; left: 0; top: 8px; font: 400 12px/16px var(--font-sans); color: var(--ink-muted); background: var(--surface-card); padding-right: 8px; }
.tl-bar { position: absolute; height: 20px; min-width: 6px; border-radius: var(--radius-pill); border: 0; padding: 0 8px; box-sizing: border-box; background: var(--glacier); color: var(--on-brand); font: 500 12px/20px var(--font-sans); text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; }
.tl-bar span { pointer-events: none; }
.tl-bar.done { background: var(--meadow); }
.tl-bar.flag { background: var(--apricot); }
.tl-bar[aria-pressed="true"] { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
.tl2-track .tl-dot { top: 9px; }
.lg { display: inline-block; width: 12px; height: 12px; border-radius: var(--radius-pill); margin-right: 6px; vertical-align: -1px; }
.lg.done { background: var(--meadow-deep); } .lg.plan { background: var(--glacier-deep); } .lg.flag { background: var(--apricot-deep); } .lg.ms { background: var(--ink); }

/* Workspace */
.work { display: flex; flex-direction: column; gap: var(--space-4); scroll-margin-top: 16px; }
.work-head { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: center; justify-content: space-between; border-top: var(--stroke-hairline) solid var(--hairline); padding-top: var(--space-5); }
.work-title { margin: 0; font: 700 28px/34px var(--font-sans); letter-spacing: -0.01em; color: var(--ink-strong); }
.tabgrid { display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); gap: var(--space-5); align-items: start; }
.tabgrid.t2r { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
@media (max-width: 1180px) { .tabgrid, .tabgrid.t2r { grid-template-columns: minmax(0, 1fr); } }
.ptable td { vertical-align: top; }
.pt-name { font-weight: 600; }
.nowrap { white-space: nowrap; }
.funds { display: flex; flex-direction: column; gap: var(--space-4); }
.fund { display: flex; flex-direction: column; gap: 6px; }
.fund-top { display: flex; justify-content: space-between; gap: var(--space-2); align-items: center; flex-wrap: wrap; font: 400 14px/20px var(--font-sans); }
.meter { height: 10px; border-radius: var(--radius-pill); background: var(--surface-sunken); overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: var(--radius-pill); background: var(--glacier-deep); }
.meter.over span { background: var(--apricot-deep); }
.fund-nums { display: flex; justify-content: space-between; gap: var(--space-2); flex-wrap: wrap; font: 400 13px/18px var(--font-sans); color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.over-t { color: var(--apricot-text); font-weight: 600; }
.team { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-3); }
.team li { display: flex; gap: var(--space-3); align-items: flex-start; }
.team .nm { font: 600 14px/20px var(--font-sans); }
.sr { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.sr li { display: flex; flex-direction: column; gap: 6px; padding: var(--space-3) 0; border-top: var(--stroke-hairline) solid var(--hairline); }
.sr li:first-child { border-top: 0; padding-top: 0; }

/* Meeting prep drawer */
.drawer-scrim { place-items: stretch end; padding: 0; }
.drawer { background: var(--surface-card); color: var(--ink); width: min(680px, 100%); height: 100%; overflow: auto; box-shadow: var(--shadow-float); padding: var(--space-5); padding-top: calc(var(--space-5) + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: var(--space-5); box-sizing: border-box; }
.drawer h2 { margin: 4px 0 2px; font: 700 24px/30px var(--font-sans); text-wrap: balance; }
.drawer section { display: flex; flex-direction: column; gap: var(--space-3); }
.dh { margin: 0; font: 600 16px/22px var(--font-sans); }

.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--space-4) var(--space-5); }
.ptable th:first-child, .ptable td:first-child { min-width: 220px; }

/* change feed */
.changes { border-color: var(--glacier-deep); background: var(--glacier-tint); }
.chg { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-3); }
.chg > li { background: var(--surface-card); border-radius: var(--radius-sm); padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: 6px; }
.chg-head { display: flex; justify-content: space-between; gap: var(--space-2); align-items: flex-start; font: 400 14px/20px var(--font-sans); }
.chg ul { margin: 0; padding-left: 18px; font: 400 13px/18px var(--font-sans); }
.banner code { font: 400 12px/18px ui-monospace, Menlo, monospace; background: var(--surface-card); padding: 1px 6px; border-radius: 6px; }

/* demo controls */
.controls { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin-top: calc(-1 * var(--space-3)); }
.switch { font: 500 13px/18px var(--font-sans); display: inline-flex; align-items: center; gap: 8px; border-radius: var(--radius-pill); padding: 6px 14px 6px 8px; border: var(--stroke-hairline) solid var(--border-control); background: var(--surface-card); color: var(--ink); cursor: pointer; }

.hstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }

.hstat { font: inherit; text-align: left; cursor: pointer; border: 0; border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5); display: flex; flex-direction: column; gap: 4px; color: var(--on-brand); min-width: 0; transition: transform .12s, box-shadow .12s; }

.an-card-sub, .ag-sub, .t-cap, .tile:not(.t-apricot) .t-cap, .act .ds, .person .tt, .qi-top, .note, .tl-lane span, .legend { color: var(--ink); }

  /* ---------- model ---------- */
  function buildModel(d) {

  function approvalState(f) {

      });

    var ticks = [];
    if (rk === "30") { for (var d = new Date(from); d < to; d = addDays(d, 1)) if (d.getDay() === 1) ticks.push({ d: new Date(d), l: MONTHS[d.getMonth()] + " " + d.getDate() }); }
    else { for (var d2 = new Date(from.getFullYear(), from.getMonth() + (from.getDate() > 1 ? 1 : 0), 1); d2 < to; d2 = new Date(d2.getFullYear(), d2.getMonth() + 1, 1)) ticks.push({ d: new Date(d2), l: MONTHS[d2.getMonth()] + (d2.getMonth() === 0 ? " " + d2.getFullYear() : "") }); }
    var selItem = null; lanes.forEach(function (l) { l.items.forEach(function (x, i) { if (sel === l.key + ":" + x.id + ":" + i) selItem = x; }); });

      ${presenter ? null : html`<p class="note">Salesforce reads and reviewed saves run through the Headless 360 connector with the viewer's own connection. This page holds no credentials, and it writes only the New Item Feedback fields listed in Update feedback, after you review and confirm the change.</p>`}
      ${prepFor ? html`<${PrepDrawer} m=${m} eventId=${prepFor} onClose=${function () { setPrepFor(null); }} onUpdate=${function (id) { setPrepFor(null); setPreparing(id); }} onAsk=${sample ? function (k, e) { setAsk(buildAsk(k, m, e)); } : null} />` : null}
      ${ask ? html`<${AskDialog} ask=${ask} sample=${sample} onClose=${function () { setAsk(null); }} onUnavailable=${function () { setSample(null); }} />` : null}
      ${ifrOpen ? html`<${IfrDialog} m=${m} mcpReady=${mcpReady} getMcp=${function () { return mcpP.current || Promise.resolve(null); }} onClose=${function (saved) { setIfrOpen(false); if (saved) refresh(); }} />` : null}
      ${hood ? html`<${UnderTheHood} watching=${watch.on} onClose=${function () { setHood(false); }} />` : null}
      ${preparing ? html`<${UpdateDialog} key=${preparing} f=${m.feedback.find(function (f) { return f.Id === preparing; })} mcpReady=${mcpReady} getMcp=${function () { return mcpP.current || Promise.resolve(null); }} onSaved=${onSaved} onClose=${function () { setPreparing(null); if (savedRef.current) { savedRef.current = false; refresh(); } }} />` : null}
    </div>`;
  }

  var root = document.getElementById("root");
  ReactDOM.createRoot(root).render(html`<${App} />`);
})();

</script>
</body>
</html>
